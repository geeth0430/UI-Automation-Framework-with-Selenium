# ==========================================================
# Framework Configuration
# No credentials or environment values are hardcoded in code.
# Override any of these via -D system properties or env vars
# in CI (see .github/workflows/selenium-ci.yml).
# ==========================================================

base.url=https://www.saucedemo.com

# chrome | firefox
browser=chrome

# true = run headless (recommended for CI)
headless=false

# Explicit wait timeout (seconds)
explicit.wait=10
page.load.timeout=30

# Standard user credentials for saucedemo.com
valid.username=standard_user
valid.password=secret_sauce

locked.username=locked_out_user
invalid.username=invalid_user
invalid.password=wrong_password

# Where ExtentReports HTML output + failure screenshots are written
report.dir=test-output/ExtentReport
screenshot.dir=screenshots
